services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            DB_TESTING_DRIVER: '${DB_TESTING_DRIVER:-mysql}'
        volumes:
            - '.:/var/www/html'
            - './docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - sail
        depends_on:
            - mysql
            - minio
            - mailpit
            - redis
            # - dynamodb

    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: "CMD mysqladmin  ping '-p${DB_PASSWORD}'"
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    minio:
        image: minio/minio
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: '${AWS_ACCESS_KEY_ID:-sail}'
            MINIO_ROOT_PASSWORD: '${AWS_SECRET_ACCESS_KEY:-password}'
        volumes:
            - 'sail-minio:/data/minio'
        networks:
            - sail
        command: 'minio server /data/minio --console-address ":8900"'
        healthcheck:
            test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
            retries: 3
            timeout: 5s

    ### Uncomment for DynamoDB cache
    # dynamodb:
    #     command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    #     image: amazon/dynamodb-local:latest
    #     working_dir: /home/dynamodblocal
    #     user: root
    #     volumes:
    #         - 'sail-dynamodb:/home/dynamodblocal/data'
    #     environment:
    #         AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-sail}'
    #         AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
    #         AWS_REGION: '${AWS_DEFAULT_REGION:-ap-southeast-2}'
    #     ports:
    #         - "${FORWARD_DYNAMODB_PORT:-8042}:8000"
    #     networks:
    #         - sail

    aws-cli:
        build:
            context: ./docker/aws
            dockerfile: Dockerfile
        image: amazon/aws-cli
        environment:
            AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-sail}'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
            AWS_BUCKETS: '${AWS_BUCKET:-local}'
            AWS_REGION: '${AWS_DEFAULT_REGION:-ap-southeast-2}'
            # DYNAMODB_CACHE_TABLE: '${DYNAMODB_CACHE_TABLE:-cache}'
            # DYNAMODB_CACHE_KEY: '${DYNAMODB_CACHE_KEY:-key}'
        entrypoint: '/usr/local/bin/create-resources'
        depends_on:
            - minio
        networks:
            - sail
        develop:
            watch:
                -   action: rebuild
                    path: ./docker/aws

networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-minio:
        driver: local
    # sail-dynamodb:
    #     driver: local
